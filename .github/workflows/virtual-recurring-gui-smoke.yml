name: Virtual Recurring - Desktop graphical acceptance

on:
  push:
    branches:
      - feature/virtual-recurring-transactions
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: virtual-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-gui-smoke:
    name: Open packaged MMEX with synthetic v22 data under Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout smoke-test script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout isolated acceptance database generator
        uses: actions/checkout@v4
        with:
          repository: hcraveiro/database
          ref: d8c1a0fe256d7ca3d5546f3259781535827916da
          path: acceptance-fixtures
          persist-credentials: false

      - name: Download previously verified packaged Linux MMEX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p package
          gh run download 42645006648 \
            --repo hcraveiro/moneymanagerex \
            --name mmex-virtual-linux-deb \
            --dir package
          find package -name '*.deb' -type f -print -quit | grep -q .

      - name: Install packaged MMEX and graphical test dependencies
        timeout-minutes: 11
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The Azure Ubuntu archive can be slow on some GitHub-hosted runners.
          # Use the standard archive while preserving Ubuntu's signed packages.
          sudo sed -i 's@azure.archive.ubuntu.com@archive.ubuntu.com@g' \
            /etc/apt/sources.list.d/ubuntu.sources
          timeout 210s sudo apt-get -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=25 update
          timeout 400s sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=25 \
            -o Dpkg::Options::=--force-confold \
            install -y --no-install-recommends \
            ./package/mmex_*.deb xvfb xdotool wmctrl scrot openbox

      - name: Launch graphical application with no user financial data
        run: |
          python3 acceptance-fixtures/tests/build_virtual_recurring_acceptance.py \
            "${RUNNER_TEMP}/acceptance-v22.mmb"
          timeout 180s xvfb-run -a -s "-screen 0 1440x900x24 -nolisten tcp" \
            bash tests/virtual_recurring_gui_smoke.sh \
            /usr/bin/mmex \
            "${RUNNER_TEMP}/acceptance-v22.mmb" \
            "${RUNNER_TEMP}/mmex-gui-smoke"

      - name: Verify GUI edit, disable and reactivate Virtual
        run: |
          timeout 180s xvfb-run -a -s "-screen 0 1440x900x24 -nolisten tcp" \
            bash tests/virtual_recurring_gui_edit.sh \
            /usr/bin/mmex \
            "${RUNNER_TEMP}/acceptance-v22.mmb" \
            "${RUNNER_TEMP}/mmex-gui-edit"

      - name: Upload privacy-safe GUI evidence and diagnostic diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmex-virtual-desktop-gui-acceptance
          path: |
            ${{ runner.temp }}/mmex-gui-smoke/mmex-initial.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-after-startup.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-scheduled-transactions.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-virtual-selected.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-virtual-edit-dialog.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-reports-navigation.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-cashflow-navigation.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-cashflow-daily.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-cashflow-daily-table.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-cashflow-monthly.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-cashflow-monthly-table.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-cashflow-transactions.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex-cashflow-transactions-table.png
            ${{ runner.temp }}/mmex-gui-smoke/mmex.log
            ${{ runner.temp }}/mmex-gui-smoke/windows.txt
            ${{ runner.temp }}/mmex-gui-smoke/window-summary.txt
            ${{ runner.temp }}/mmex-gui-smoke/ledger-before.json
            ${{ runner.temp }}/mmex-gui-smoke/ledger-diff.json
            ${{ runner.temp }}/mmex-gui-smoke/working-copy-v22.mmb
            ${{ runner.temp }}/mmex-gui-edit/edit-before.png
            ${{ runner.temp }}/mmex-gui-edit/edit-amount-saved.png
            ${{ runner.temp }}/mmex-gui-edit/virtual-unchecked.png
            ${{ runner.temp }}/mmex-gui-edit/virtual-reactivated.png
            ${{ runner.temp }}/mmex-gui-edit/edit-dialog-missing.png
            ${{ runner.temp }}/mmex-gui-edit/mmex-edit.log
            ${{ runner.temp }}/mmex-gui-edit/edited-copy-v22.mmb
          if-no-files-found: warn
          retention-days: 14
